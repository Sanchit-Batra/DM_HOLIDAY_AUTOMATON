name: Holiday Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check-holiday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install selenium sinricpro

      - name: Run holiday checker
        env:
          DMSWITCH_DEVICE_ID: ${{ secrets.DMSWITCH_DEVICE_ID }}
          SINRICPRO_APP_KEY: ${{ secrets.SINRICPRO_APP_KEY }}
          SINRICPRO_APP_SECRET: ${{ secrets.SINRICPRO_APP_SECRET }}
        run: |
          python "DM Holiday Automation.py"


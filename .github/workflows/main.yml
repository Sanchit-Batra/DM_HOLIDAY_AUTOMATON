name: Holiday Check

on:
  schedule:
    - cron: '7,22,37,52 5-23 * * *'
  workflow_dispatch:

jobs:
  check-holiday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mandatory step to ensure Selenium can find a browser to control
      - name: Setup Chrome/Chromedriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install Devanagari fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run holiday checker
        env:
          DMSWITCH_DEVICE_ID: ${{ secrets.DMSWITCH_DEVICE_ID }}
          SINRICPRO_APP_KEY: ${{ secrets.SINRICPRO_APP_KEY }}
          SINRICPRO_APP_SECRET: ${{ secrets.SINRICPRO_APP_SECRET }}
        run: |
          python "DM Holiday Automation.py"
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-bundle
          path: |
            screenshot.png
            loading_phase.html
